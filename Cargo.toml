[package]
name = "lazy-aws"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
# TUI
ratatui = { version = "0.29", features = ["crossterm", "all-widgets"] }
crossterm = "0.28"

# Async
tokio = { version = "1", features = ["full"] }

# AWS SDK
aws-config = "1.5"
aws-sdk-ec2 = "1.82"
aws-sdk-s3 = "1.65"
aws-sdk-rds = "1.99"
aws-sdk-dynamodb = "1.54"
aws-sdk-lambda = "1.59"
aws-sdk-iam = "1.51"
aws-sdk-backup = "1.56"
aws-sdk-cloudtrail = "1.55"
aws-smithy-types = "1.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
